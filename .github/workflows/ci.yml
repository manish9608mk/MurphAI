name: MurphAI CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Prepare MLflow champion model
        env:
          DATABASE_URL: sqlite://
          SECRET_KEY: ci-test-secret-key-1234567890123456
          ALGORITHM: HS256
        run: |
          python -m ml.src.models.train_random_forest
          python -c "from ml.src.registry.model_registry import register_latest_random_forest; model_version = register_latest_random_forest(); print(f'Registered model version: {model_version.version}')"

      - name: Run tests
        env:
          DATABASE_URL: sqlite://
          SECRET_KEY: ci-test-secret-key-1234567890123456
          ALGORITHM: HS256
        run: python -m pytest -q

      - name: Build Docker image
        run: |
          docker build \
            -f infrastructure/docker/Dockerfile \
            -t murphai-backend:ci \
            .
