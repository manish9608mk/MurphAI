services:

  # MurphAI Backend + ML Service

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile

    # Container name used for local development.
    container_name: murphai-backend

    # Load secrets and configuration from the local .env file.
    env_file:
      - .env

    # Start the backend only after PostgreSQL is healthy.
    depends_on:
      postgres:
        condition: service_healthy

    # Expose the FastAPI application on port 8000.
    ports:
      - "8000:8000"

    # Persist MLflow model registry/artifacts.
    volumes:

      # MLflow metadata database.
      - ./mlflow.db:/app/mlflow.db

      # Existing MLflow model artifacts.
      #
      # MLflow 3 stored the artifact location using
      # this absolute path, so the same path is mounted
      # inside the container for local development.
      - ./mlruns:/Users/manishkumar/Documents/Explorer/MurphAI/mlruns

    # Restart the container automatically if it stops unexpectedly.
    restart: unless-stopped


  # MurphAI PostgreSQL Database

  postgres:
    image: postgres:16

    # Container name used for local development.
    container_name: murphai-postgres

    # Local development database configuration.
    environment:
      POSTGRES_DB: murphai
      POSTGRES_USER: murphai
      POSTGRES_PASSWORD: murphai_dev_password

    # Persist PostgreSQL data between container restarts.
    volumes:
      - postgres_data:/var/lib/postgresql/data

    # Check whether PostgreSQL is ready to accept connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U murphai -d murphai"]
      interval: 10s
      timeout: 5s
      retries: 5

    # Restart the database automatically if it stops unexpectedly.
    restart: unless-stopped


# Persistent Docker volumes

volumes:
  postgres_data: